<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishu Share</title>
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --accent: #4285f4;
            --accent-hover: #3367d6;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --danger: #e53e3e;
            --success: #38a169;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(66, 133, 244, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            border-radius: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .quota-badge {
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(66, 133, 244, 0.1);
            color: var(--accent);
            font-weight: 500;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(229, 62, 62, 0.1);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(229, 62, 62, 0.2);
        }

        .btn-icon {
            padding: 0.5rem;
            border-radius: 0.5rem;
        }

        /* Auth View */
        #auth-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }

        .auth-card {
            padding: 3rem;
            border-radius: 1.5rem;
            max-width: 400px;
            width: 100%;
        }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: 1.5rem;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .drop-zone.drag-over {
            background: rgba(66, 133, 244, 0.1);
            transform: scale(1.02);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Progress */
        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-item {
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 9999px;
            transition: width 0.3s ease;
        }

        /* Search */
        .search-bar {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        /* File Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .file-card {
            padding: 1.5rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-header {
            display: flex;
            align-items: start;
            gap: 1rem;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            border-radius: 0.75rem;
            background: rgba(66, 133, 244, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem;
        }

        .file-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .file-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .file-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 0.5rem;
            font-size: 0.875rem;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 1.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .preview-content {
            margin-top: 1rem;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #000;
        }

        .preview-content img, .preview-content video {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        .preview-content iframe {
            width: 100%;
            height: 60vh;
            border: none;
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
        }

        .hidden {
            display: none !important;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .flex { display: flex; }
        .gap-2 { gap: 0.5rem; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 1rem; text-align: center; }
            .file-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <script>
        // =========================================================================
        // SECURITY CONFIGURATION
        // =========================================================================

        // Browser applications must NEVER contain or use Client Secrets. 
        // Google Identity Services (GIS) uses PKCE/Implicit flow which only requires CLIENT_ID.
        // The Client ID below is obfuscated to prevent casual scraping.
        // =========================================================================
        const _0x5f2a = (function() {
            // Base64 encoded Client ID: 395729354499-6a33nn8io2oj7ltosnuofsfj6kikqjfu.apps.googleusercontent.com
            const _key = "Mzk1NzI5MzU0NDk5LTZhMzNubjhpbzJvajdsdG9zbnVvZnNmajZraWtxamZ1LmFwcHMuZ29vZ2xldXNlcmNvbnRlbnQuY29t";
            return {
                get clientId() { return atob(_key); }
            };
        })();

        const CONFIG = {
            CLIENT_ID: _0x5f2a.clientId,
            API_KEY: "",
            SCOPES: "https://www.googleapis.com/auth/drive.file"
        };
    </script>

    <div class="container">
        <!-- Header -->
        <header class="header glass" id="app-header" style="display: none;">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Krishu Share
            </div>
            <div class="header-actions">
                <div class="quota-badge" id="quota-display">Loading quota...</div>
                <button class="btn btn-secondary btn-icon" onclick="toggleTheme()" title="Toggle Theme">
                    <span id="theme-icon">🌙</span>
                </button>
                <button class="btn btn-secondary" onclick="signOut()">Sign Out</button>
            </div>
        </header>

        <!-- Auth View -->
        <div id="auth-view">
            <div class="auth-card glass">
                <div class="logo justify-center mb-4" style="font-size: 2rem; justify-content: center;">
                    Krishu Share
                </div>
                <p class="text-secondary mb-4">Secure, premium cloud file sharing powered by Google Drive.</p>
                <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="handleAuthClick()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Sign in with Google
                </button>
            </div>
        </div>

        <!-- App View -->
        <div id="app-view" class="hidden">
            <!-- Drop Zone -->
            <div class="drop-zone glass" id="drop-zone">
                <input type="file" id="file-input" multiple onchange="handleFiles(this.files)">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="margin: 0 auto 1rem;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h3 class="mb-4">Drag & Drop files here</h3>
                <p class="text-secondary">or click to browse</p>
            </div>

            <!-- Progress Container -->
            <div class="progress-container" id="progress-container"></div>

            <!-- Search -->
            <input type="text" class="search-bar" id="search-input" placeholder="Search files..." oninput="filterFiles(this.value)">

            <!-- History Grid -->
            <div class="file-grid" id="file-grid"></div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="preview-modal" onclick="closeModal('preview-modal')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('preview-modal')">&times;</button>
            <h3 id="preview-title" class="mb-4">Preview</h3>
            <div class="preview-content" id="preview-content"></div>
        </div>
    </div>

    <!-- QR Modal -->
    <div class="modal-overlay" id="qr-modal" onclick="closeModal('qr-modal')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('qr-modal')">&times;</button>
            <h3 class="text-center mb-4">Scan to Share</h3>
            <div class="qr-container">
                <div id="qrcode"></div>
                <p class="text-secondary text-center" id="qr-link" style="word-break: break-all;"></p>
                <button class="btn btn-primary" onclick="copyToClipboard(document.getElementById('qr-link').textContent)">Copy Link</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let accessToken = null;
        let tokenClient = null;
        let fileHistory = JSON.parse(localStorage.getItem('krishu_share_history') || '[]');

        // Initialize GIS
        function initGis() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CONFIG.CLIENT_ID,
                scope: CONFIG.SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        console.error(response);
                        alert('Authentication failed');
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('auth-view').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    document.getElementById('app-header').style.display = 'flex';
                    loadQuota();
                    renderHistory();
                },
            });
        }

        function handleAuthClick() {
            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken, () => {
                    accessToken = null;
                    location.reload();
                });
            } else {
                tokenClient.requestAccessToken();
            }
        }

        function signOut() {
            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken, () => {
                    accessToken = null;
                    location.reload();
                });
            }
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('krishu_theme', isDark ? 'dark' : 'light');
        }

        // Initialize theme
        if (localStorage.getItem('krishu_theme') === 'dark' || (!localStorage.getItem('krishu_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').textContent = '☀️';
        }

        // Drag and Drop
        const dropZone = document.getElementById('drop-zone');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        // File Handling
        async function handleFiles(files) {
            for (const file of files) {
                await uploadFile(file);
            }
        }

        async function uploadFile(file) {
            const progressId = 'prog-' + Date.now() + Math.random();
            createProgressItem(progressId, file.name, 0);

            try {
                const metadata = {
                    name: file.name,
                    mimeType: file.type || 'application/octet-stream'
                };

                // Step 1: Initiate resumable upload
                const initRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify(metadata)
                });

                if (!initRes.ok) throw new Error('Failed to initiate upload');
                const sessionUrl = initRes.headers.get('Location');

                // Step 2: Upload file with progress
                const fileInfo = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('PUT', sessionUrl, true);
                    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
                    
                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable) {
                            const percent = (event.loaded / event.total) * 100;
                            updateProgress(progressId, percent);
                        }
                    };
                    
                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve(JSON.parse(xhr.responseText));
                        } else {
                            reject(new Error(xhr.responseText));
                        }
                    };
                    
                    xhr.onerror = () => reject(new Error('Network error'));
                    xhr.send(file);
                });

                // Step 3: Make public
                await makePublic(fileInfo.id);

                // Step 4: Save to history
                const fileRecord = {
                    id: fileInfo.id,
                    name: fileInfo.name,
                    mimeType: fileInfo.mimeType,
                    size: file.size,
                    uploadDate: new Date().toISOString()
                };
                
                fileHistory.unshift(fileRecord);
                localStorage.setItem('krishu_share_history', JSON.stringify(fileHistory));
                
                removeProgressItem(progressId);
                renderHistory();
                loadQuota(); // Update quota after upload

            } catch (error) {
                console.error(error);
                updateProgress(progressId, 0, 'Error: ' + error.message);
            }
        }

        async function makePublic(fileId) {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    role: 'reader',
                    type: 'anyone'
                })
            });
            if (!res.ok) throw new Error('Failed to make file public');
            return res.json();
        }

        // Progress UI
        function createProgressItem(id, name, percent) {
            const container = document.getElementById('progress-container');
            const div = document.createElement('div');
            div.className = 'progress-item glass';
            div.id = id;
            div.innerHTML = `
                <div style="flex: 1;">
                    <div style="font-weight: 500; margin-bottom: 0.5rem;">${name}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%"></div>
                    </div>
                    <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;" class="status-text">Uploading... ${percent.toFixed(0)}%</div>
                </div>
            `;
            container.appendChild(div);
        }

        function updateProgress(id, percent, status = null) {
            const item = document.getElementById(id);
            if (!item) return;
            item.querySelector('.progress-fill').style.width = percent + '%';
            if (status) {
                item.querySelector('.status-text').textContent = status;
                item.querySelector('.status-text').style.color = 'var(--danger)';
            } else {
                item.querySelector('.status-text').textContent = `Uploading... ${percent.toFixed(0)}%`;
            }
        }

        function removeProgressItem(id) {
            const item = document.getElementById(id);
            if (item) {
                item.style.opacity = '0';
                setTimeout(() => item.remove(), 300);
            }
        }

        // History & Rendering
        function renderHistory(filter = '') {
            const grid = document.getElementById('file-grid');
            grid.innerHTML = '';
            
            const filtered = fileHistory.filter(f => f.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card glass';
                
                const icon = getFileIcon(file.mimeType);
                const date = new Date(file.uploadDate).toLocaleDateString();
                const size = formatBytes(file.size);
                
                const shareLink = `https://drive.google.com/file/d/${file.id}/view?usp=sharing`;
                const downloadLink = `https://drive.google.com/uc?export=download&id=${file.id}`;
                const previewLink = `https://drive.google.com/file/d/${file.id}/preview`;
                
                card.innerHTML = `
                    <div class="file-header">
                        <div class="file-icon">${icon}</div>
                        <div class="file-info">
                            <div class="file-name" title="${file.name}">${file.name}</div>
                            <div class="file-meta">${date} • ${size}</div>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-secondary" onclick="openPreview('${file.id}', '${file.name}', '${file.mimeType}')">Open</button>
                        <button class="btn btn-secondary" onclick="copyToClipboard('${shareLink}')">Copy</button>
                        <button class="btn btn-primary" onclick="window.open('${downloadLink}', '_blank')">Download</button>
                        <button class="btn btn-secondary" onclick="showQR('${shareLink}')">QR</button>
                        <button class="btn btn-secondary" onclick="shareFile('${file.name}', '${shareLink}')">Share</button>
                        <button class="btn btn-danger" onclick="deleteFile('${file.id}', this)">Delete</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getFileIcon(mimeType) {
            if (mimeType.startsWith('image/')) return '🖼️';
            if (mimeType.startsWith('video/')) return '🎬';
            if (mimeType === 'application/pdf') return '📄';
            if (mimeType.includes('word') || mimeType.includes('document')) return '📝';
            if (mimeType.includes('sheet') || mimeType.includes('excel')) return '📊';
            return '📁';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function filterFiles(query) {
            renderHistory(query);
        }

        // File Operations
        async function deleteFile(fileId, btnElement) {
            if (!confirm('Are you sure you want to delete this file from Google Drive?')) return;
            
            btnElement.disabled = true;
            btnElement.textContent = 'Deleting...';
            
            try {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                if (res.ok) {
                    fileHistory = fileHistory.filter(f => f.id !== fileId);
                    localStorage.setItem('krishu_share_history', JSON.stringify(fileHistory));
                    renderHistory(document.getElementById('search-input').value);
                    loadQuota();
                } else {
                    throw new Error('Delete failed');
                }
            } catch (error) {
                alert('Failed to delete file');
                btnElement.disabled = false;
                btnElement.textContent = 'Delete';
            }
        }

        async function renameFile(fileId, currentName) {
            const newName = prompt('Enter new file name:', currentName);
            if (!newName || newName === currentName) return;
            
            try {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: newName })
                });
                
                if (res.ok) {
                    const file = fileHistory.find(f => f.id === fileId);
                    if (file) {
                        file.name = newName;
                        localStorage.setItem('krishu_share_history', JSON.stringify(fileHistory));
                        renderHistory(document.getElementById('search-input').value);
                    }
                } else {
                    throw new Error('Rename failed');
                }
            } catch (error) {
                alert('Failed to rename file');
            }
        }

        // Preview
        function openPreview(fileId, fileName, mimeType) {
            const modal = document.getElementById('preview-modal');
            const title = document.getElementById('preview-title');
            const content = document.getElementById('preview-content');
            
            title.textContent = fileName;
            content.innerHTML = '';
            
            if (mimeType.startsWith('image/')) {
                content.innerHTML = `<img src="https://drive.google.com/uc?export=view&id=${fileId}" alt="${fileName}">`;
            } else if (mimeType.startsWith('video/')) {
                content.innerHTML = `<video controls><source src="https://drive.google.com/uc?export=download&id=${fileId}" type="${mimeType}">Your browser does not support video.</video>`;
            } else if (mimeType === 'application/pdf' || mimeType.includes('document') || mimeType.includes('sheet')) {
                content.innerHTML = `<iframe src="https://drive.google.com/file/d/${fileId}/preview"></iframe>`;
            } else {
                content.innerHTML = `<div style="padding: 3rem; text-align: center; color: white;">Preview not available for this file type.<br>Please download to view.</div>`;
            }
            
            modal.classList.add('active');
        }

        // QR Code
        function showQR(link) {
            const modal = document.getElementById('qr-modal');
            const container = document.getElementById('qrcode');
            const linkText = document.getElementById('qr-link');
            
            container.innerHTML = '';
            linkText.textContent = link;
            
            new QRCode(container, {
                text: link,
                width: 200,
                height: 200,
                colorDark: document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000',
                colorLight: 'transparent',
                correctLevel: QRCode.CorrectLevel.H
            });
            
            modal.classList.add('active');
        }

        // Utilities
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('Link copied to clipboard!');
            });
        }

        async function shareFile(name, url) {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: name,
                        text: `Check out this file: ${name}`,
                        url: url
                    });
                } catch (err) {
                    console.log('Share canceled');
                }
            } else {
                copyToClipboard(url);
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Quota
        async function loadQuota() {
            try {
                const res = await fetch('https://www.googleapis.com/drive/v3/about?fields=storageQuota', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                const data = await res.json();
                const quota = data.storageQuota;
                const used = parseInt(quota.usage);
                const limit = parseInt(quota.limit);
                const remaining = limit - used;
                
                document.getElementById('quota-display').textContent = `${formatBytes(remaining)} available`;
            } catch (error) {
                console.error('Failed to load quota', error);
            }
        }

        // Initialize
        window.onload = () => {
            initGis();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KriSpark</title>
    
    <!-- Tailwind CSS for ChatGPT like styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            background-color: #212121;
            color: #ececec;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        .chat-container {
            scroll-behavior: smooth;
        }

        /* Markdown Styles */
        .prose pre {
            margin: 0 !important;
            padding: 0 !important;
            background-color: transparent !important;
            border: none !important;
        }
        .prose code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: #e5e5e5;
            background: #333;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.85em;
        }
        .prose pre code {
            background: transparent;
            padding: 0;
            color: #e5e5e5;
        }
        .prose p { margin-bottom: 12px; line-height: 1.7; }

        /* Animation for new messages */
        @keyframes messageFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: messageFadeIn 0.3s ease-out forwards;
        }

        /* Typing indicator animation */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-[260px] bg-[#171717] flex-col h-full shrink-0 border-r border-white/10 hidden md:flex">
        <div class="p-3">
            <button onclick="clearChat()" class="w-full flex items-center gap-2 p-3 rounded-lg hover:bg-[#212121] transition-colors text-sm font-medium text-gray-200">
                <i class="ph ph-plus text-lg"></i>
                New chat
                <i class="ph ph-note-pencil text-lg ml-auto text-gray-400"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3">
            <div class="px-2 pb-2 text-xs font-semibold text-gray-500">History</div>
            <div class="p-2 rounded-lg bg-[#212121] text-gray-200 text-sm cursor-pointer truncate">
                KriSpark Conversation
            </div>
        </div>
        
        <div class="p-3 border-t border-white/10">
            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#212121] cursor-pointer transition-colors">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-sm shrink-0">
                    U
                </div>
                <div class="text-sm font-medium text-gray-200 truncate">User</div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative h-full w-full bg-[#212121]">
        
        <!-- Header (Mobile visible, Desktop minimal) -->
        <header class="flex items-center justify-between p-3 absolute top-0 left-0 right-0 z-10 bg-gradient-to-b from-[#212121] to-transparent">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg font-medium text-lg text-gray-200">
                KriSpark 
                <span class="text-gray-500 text-xs ml-1 border border-gray-600 rounded px-1">gemma2:2b</span>
            </div>
            <button onclick="clearChat()" class="p-2 text-gray-400 hover:text-white md:hidden">
                <i class="ph ph-note-pencil text-xl"></i>
            </button>
        </header>

        <!-- Chat Container -->
        <div id="chat" class="chat-container flex-1 overflow-y-auto w-full pb-32 pt-16 flex flex-col items-center">
            
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4 w-full max-w-3xl transition-opacity duration-300">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center mb-6 shadow-xl shadow-purple-900/20">
                    <span class="text-4xl font-bold text-white drop-shadow-md">K</span>
                </div>
                <h1 class="text-3xl md:text-4xl font-semibold text-white mb-8 text-center tracking-tight">How can I help you today?</h1>
            </div>

        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent pt-6 pb-6 px-4 md:px-0 flex justify-center">
            <div class="w-full max-w-3xl relative">
                <div class="bg-[#2f2f2f] rounded-[26px] flex items-end p-2 shadow-xl border border-white/10 focus-within:border-white/20 focus-within:ring-2 focus-within:ring-white/10 transition-all duration-300">
                    
                    <button class="p-2.5 text-gray-400 hover:text-gray-200 rounded-full transition-colors mb-0.5">
                        <i class="ph ph-paperclip text-xl"></i>
                    </button>
                    
                    <textarea 
                        id="message" 
                        class="flex-1 bg-transparent border-none outline-none text-white resize-none max-h-48 py-3 px-2 focus:ring-0 leading-relaxed text-[15.5px]"
                        placeholder="Message KriSpark..."
                        rows="1"
                        oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 200) + 'px';"
                        onkeydown="handleKeydown(event)"
                    ></textarea>
                    
                    <button 
                        id="sendBtn" 
                        onclick="sendMessage()"
                        class="p-2.5 mb-0.5 ml-2 bg-[#444] text-gray-500 rounded-full transition-all flex items-center justify-center h-[38px] w-[38px]"
                        disabled
                    >
                        <i class="ph-fill ph-arrow-up text-lg"></i>
                    </button>
                </div>
                <div class="text-center text-xs text-gray-500 mt-3">
                    KriSpark can make mistakes. Consider verifying important information.
                </div>
            </div>
        </div>

    </main>

    <script>
        // API Configuration (Your Ngrok URL)
        const API_BASE_URL = "https://snuggle-monkhood-venture.ngrok-free.dev";

        // ==========================================
        // SYSTEM PROMPT (Upgraded for Better AI Behavior)
        // ==========================================
        const systemPrompt = {
            role: "system",
            content: "You are KriSpark, an elite, highly intelligent, and ultra-smart assistant. CRITICAL RULE 1: If the user asks 'Who made you?', 'Who created you?', 'Tumhe kisne banaya?', or 'Who is Krishna?', you MUST reply EXACTLY with: 'Mujhe Krishna ne banaya hai, jo BCA 1st year ke student hain.' Do NOT mention this unless specifically asked. CRITICAL RULE 2: For all other questions, be extremely smart, logical, and helpful. Provide highly detailed, structured, and accurate answers. Always use Markdown for formatting and code blocks. CRITICAL RULE 3: Respond naturally in the language the user is speaking (e.g., Hinglish, Hindi, or English)."
        };

        const chat = document.getElementById("chat");
        const input = document.getElementById("message");
        const sendBtn = document.getElementById("sendBtn");
        const welcomeScreen = document.getElementById("welcome-screen");

        let conversation = [];
        let isSending = false;

        // ==========================================
        // LOCAL STORAGE / CHAT HISTORY
        // ==========================================
        function loadChats() {
            try {
                const saved = localStorage.getItem("krishna_ai_history");
                if (saved) {
                    let parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        // Filter out old system prompts and invalid messages safely
                        const historyMsgs = parsed.filter(msg => msg && msg.role && msg.content && msg.role !== 'system');
                        
                        // Rebuild with fresh system prompt
                        conversation = [systemPrompt, ...historyMsgs];
                        
                        if (historyMsgs.length > 0) { 
                            welcomeScreen.style.display = "none";
                            historyMsgs.forEach(msg => {
                                renderMessage(msg.content, msg.role, true); // true = no animation on load
                            });
                        }
                    } else {
                        conversation = [systemPrompt];
                    }
                } else {
                    conversation = [systemPrompt];
                }
            } catch(e) {
                console.error("Storage load error:", e);
                conversation = [systemPrompt];
            }
            scrollToBottom();
        }

        function saveChats() {
            localStorage.setItem("krishna_ai_history", JSON.stringify(conversation));
        }

        function clearChat() {
            // 1. Clear storage and reset array
            localStorage.removeItem("krishna_ai_history");
            conversation = [systemPrompt];
            isSending = false;
            
            // 2. Remove all chat messages from UI (without reloading page)
            const msgs = document.querySelectorAll('.chat-msg');
            msgs.forEach(m => m.remove());
            removeLoading();
            
            // 3. Show Welcome screen again
            welcomeScreen.style.display = ""; // Removes 'none', falls back to flex class
            
            // 4. Reset Input Box
            input.value = "";
            input.style.height = 'auto';
            sendBtn.classList.add("bg-[#444]", "text-gray-500");
            sendBtn.classList.remove("bg-white", "text-black");
            sendBtn.disabled = true;
        }

        // Initialize chats on load
        loadChats();

        // ==========================================
        // UI & EVENT LISTENERS
        // ==========================================
        input.addEventListener("input", function() {
            if (this.value.trim().length > 0 && !isSending) {
                sendBtn.classList.remove("bg-[#444]", "text-gray-500");
                sendBtn.classList.add("bg-white", "text-black");
                sendBtn.disabled = false;
            } else {
                sendBtn.classList.add("bg-[#444]", "text-gray-500");
                sendBtn.classList.remove("bg-white", "text-black");
                sendBtn.disabled = true;
            }
        });

        function handleKeydown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chat.scrollTop = chat.scrollHeight;
            }, 100);
        }

        function renderMessage(text, role, isHistory = false) {
            const div = document.createElement("div");
            // Manage animation: No animation when loading history for a smoother look
            const animClass = isHistory ? "opacity-100" : "opacity-0 animate-fade-in";
            div.className = `chat-msg w-full flex justify-center py-6 px-4 md:px-0 ${animClass}`;
            
            const safeText = text || "";
            
            if (role === "user") {
                div.innerHTML = `
                    <div class="max-w-3xl w-full flex justify-end">
                        <div class="bg-[#303030] text-gray-100 px-5 py-3 rounded-3xl rounded-tr-sm max-w-[75%] break-words text-[15.5px] shadow-sm border border-white/5">
                            ${safeText.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            } else {
                // Parse markdown for AI responses
                const parsedHTML = marked.parse(safeText);
                div.innerHTML = `
                    <div class="max-w-3xl w-full flex gap-4">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center flex-shrink-0 mt-1 shadow-md">
                            <span class="text-white font-bold text-sm">K</span>
                        </div>
                        <div class="flex-1 prose prose-invert max-w-none text-gray-100 text-[15.5px] leading-relaxed min-w-0 ai-content">
                            ${parsedHTML}
                        </div>
                    </div>
                `;

                // Add Premium Code Blocks with Copy Button
                const aiContent = div.querySelector('.ai-content');
                if (aiContent) {
                    const preTags = aiContent.querySelectorAll('pre');
                    preTags.forEach(pre => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'bg-[#0d0d0d] rounded-xl my-5 overflow-hidden border border-[#333] shadow-md';
                        
                        const header = document.createElement('div');
                        header.className = 'flex items-center justify-between px-4 py-2 bg-[#2a2a2a] text-xs text-gray-300 font-sans border-b border-[#333]';
                        
                        const codeElement = pre.querySelector('code');
                        const langClass = codeElement ? Array.from(codeElement.classList).find(c => c.startsWith('language-')) : null;
                        const lang = langClass ? langClass.replace('language-', '') : 'code';
                        
                        header.innerHTML = `
                            <span class="font-semibold tracking-wider text-gray-400 capitalize">${lang}</span>
                            <button class="copy-btn flex items-center gap-1.5 hover:text-white transition-colors cursor-pointer text-gray-400">
                                <i class="ph ph-copy text-sm"></i> Copy code
                            </button>
                        `;
                        
                        // Copy Logic (Handles iframe limitations gracefully)
                        const copyBtn = header.querySelector('.copy-btn');
                        copyBtn.onclick = () => {
                            const codeText = pre.innerText;
                            const textarea = document.createElement('textarea');
                            textarea.value = codeText;
                            document.body.appendChild(textarea);
                            textarea.select();
                            try {
                                document.execCommand('copy');
                                copyBtn.innerHTML = '<i class="ph ph-check text-green-400 text-sm"></i> <span class="text-green-400">Copied!</span>';
                            } catch (e) {
                                copyBtn.innerHTML = '<i class="ph ph-x text-red-400 text-sm"></i> <span class="text-red-400">Error</span>';
                            }
                            document.body.removeChild(textarea);
                            
                            setTimeout(() => {
                                copyBtn.innerHTML = '<i class="ph ph-copy text-sm"></i> Copy code';
                            }, 2000);
                        };

                        pre.parentNode.insertBefore(wrapper, pre);
                        wrapper.appendChild(header);
                        
                        // Reset pre styling so it fits nicely inside our custom wrapper
                        pre.style.margin = '0';
                        pre.style.padding = '16px';
                        pre.style.overflowX = 'auto';
                        wrapper.appendChild(pre);
                    });
                }
            }

            chat.appendChild(div);
            scrollToBottom();
        }

        function showLoading() {
            const div = document.createElement("div");
            div.id = "loading-indicator";
            // Added 'chat-msg' class here as well
            div.className = "chat-msg w-full flex justify-center py-5 px-4 md:px-0";
            div.innerHTML = `
                <div class="max-w-3xl w-full flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center flex-shrink-0 mt-1">
                        <span class="text-black font-bold text-sm">K</span>
                    </div>
                    <div class="flex-1 mt-3 typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chat.appendChild(div);
            scrollToBottom();
        }

        function removeLoading() {
            const loader = document.getElementById("loading-indicator");
            if (loader) loader.remove();
        }

        // ==========================================
        // API CALL
        // ==========================================
        async function sendMessage() {
            const text = input.value.trim();
            if (!text || isSending) return;

            welcomeScreen.style.display = "none";
            isSending = true;
            
            // Reset input UI
            input.value = "";
            input.style.height = 'auto';
            sendBtn.classList.add("bg-[#444]", "text-gray-500");
            sendBtn.classList.remove("bg-white", "text-black");
            sendBtn.disabled = true;

            // Render User Message
            renderMessage(text, "user");
            conversation.push({ role: "user", content: text });
            saveChats();

            showLoading();

            try {
                const response = await fetch(API_BASE_URL + "/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true" // Important for Ngrok
                    },
                    body: JSON.stringify({
                        model: "gemma2:2b",
                        messages: conversation
                    })
                });

                const data = await response.json();
                removeLoading();

                if (!response.ok) {
                    const errorMsg = "Error: " + (data.error || "Server issue");
                    renderMessage(errorMsg, "assistant");
                    return;
                }

                const reply = data.reply || data.message?.content || "No response.";
                
                // Add AI reply to conversation and UI
                conversation.push({ role: "assistant", content: reply });
                renderMessage(reply, "assistant");
                saveChats();

            } catch (error) {
                removeLoading();
                renderMessage("Server se connect nahi ho pa raha hai. (Ensure Ngrok is running)\n\n" + error.message, "assistant");
            } finally {
                isSending = false;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna AI</title>
    
    <!-- Tailwind CSS for ChatGPT like styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            background-color: #212121;
            color: #ececec;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        .chat-container {
            scroll-behavior: smooth;
        }

        /* Markdown Styles */
        .prose pre {
            background-color: #0d0d0d !important;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .prose code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: #e5e5e5;
            background: #333;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .prose pre code {
            background: transparent;
            padding: 0;
            color: #10b981; /* Greenish code color */
        }
        .prose p { margin-bottom: 10px; }

        /* Typing indicator animation */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-[260px] bg-[#171717] flex-col h-full shrink-0 border-r border-white/10 hidden md:flex">
        <div class="p-3">
            <button onclick="clearChat()" class="w-full flex items-center gap-2 p-3 rounded-lg hover:bg-[#212121] transition-colors text-sm font-medium text-gray-200">
                <i class="ph ph-plus text-lg"></i>
                New chat
                <i class="ph ph-note-pencil text-lg ml-auto text-gray-400"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3">
            <div class="px-2 pb-2 text-xs font-semibold text-gray-500">History</div>
            <div class="p-2 rounded-lg bg-[#212121] text-gray-200 text-sm cursor-pointer truncate">
                Krishna AI Conversation
            </div>
        </div>
        
        <div class="p-3 border-t border-white/10">
            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-[#212121] cursor-pointer transition-colors">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-sm shrink-0">
                    U
                </div>
                <div class="text-sm font-medium text-gray-200 truncate">User</div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative h-full w-full bg-[#212121]">
        
        <!-- Header (Mobile visible, Desktop minimal) -->
        <header class="flex items-center justify-between p-3 absolute top-0 left-0 right-0 z-10 bg-gradient-to-b from-[#212121] to-transparent">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg font-medium text-lg text-gray-200">
                Krishna AI 
                <span class="text-gray-500 text-xs ml-1 border border-gray-600 rounded px-1">gemma2:2b</span>
            </div>
            <button onclick="clearChat()" class="p-2 text-gray-400 hover:text-white md:hidden">
                <i class="ph ph-note-pencil text-xl"></i>
            </button>
        </header>

        <!-- Chat Container -->
        <div id="chat" class="chat-container flex-1 overflow-y-auto w-full pb-32 pt-16 flex flex-col items-center">
            
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4 w-full max-w-3xl">
                <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center mb-6 shadow-lg">
                    <span class="text-3xl font-bold text-black">K</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-semibold text-white mb-8 text-center">How can I help you today?</h1>
            </div>

        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent pt-6 pb-6 px-4 md:px-0 flex justify-center">
            <div class="w-full max-w-3xl relative">
                <div class="bg-[#2f2f2f] rounded-[24px] flex items-end p-2 shadow-lg border border-white/5">
                    
                    <button class="p-2.5 text-gray-400 hover:text-gray-200 rounded-full transition-colors mb-0.5">
                        <i class="ph ph-paperclip text-xl"></i>
                    </button>
                    
                    <textarea 
                        id="message" 
                        class="flex-1 bg-transparent border-none outline-none text-white resize-none max-h-48 py-3 px-2 focus:ring-0 leading-relaxed text-[15.5px]"
                        placeholder="Message Krishna AI..."
                        rows="1"
                        oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 200) + 'px';"
                        onkeydown="handleKeydown(event)"
                    ></textarea>
                    
                    <button 
                        id="sendBtn" 
                        onclick="sendMessage()"
                        class="p-2.5 mb-0.5 ml-2 bg-[#444] text-gray-500 rounded-full transition-all flex items-center justify-center h-[38px] w-[38px]"
                        disabled
                    >
                        <i class="ph-fill ph-arrow-up text-lg"></i>
                    </button>
                </div>
                <div class="text-center text-xs text-gray-500 mt-3">
                    Krishna AI can make mistakes. Consider verifying important information.
                </div>
            </div>
        </div>

    </main>

    <script>
        // API Configuration (Your Ngrok URL)
        const API_BASE_URL = "https://snuggle-monkhood-venture.ngrok-free.dev";

        // ==========================================
        // SYSTEM PROMPT (Strict & Short)
        // ==========================================
        const systemPrompt = {
            role: "system",
            content: "You are Krishna AI, a helpful assistant. Secret Rule: Only if the user asks exactly 'who made you', 'who created you', or 'who is Krishna', you must reply: 'Mujhe Krishna ne banaya hai, jo BCA 1st year ke student hain.' DO NOT mention this secret rule or Krishna in any other response. For all other queries, answer normally."
        };

        const chat = document.getElementById("chat");
        const input = document.getElementById("message");
        const sendBtn = document.getElementById("sendBtn");
        const welcomeScreen = document.getElementById("welcome-screen");

        let conversation = [];
        let isSending = false;

        // ==========================================
        // LOCAL STORAGE / CHAT HISTORY
        // ==========================================
        function loadChats() {
            try {
                const saved = localStorage.getItem("krishna_ai_history");
                if (saved) {
                    let parsed = JSON.parse(saved);
                    // Check if valid array and has data
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        // Always ensure the first message is the latest system prompt
                        if (parsed[0].role === 'system') {
                            parsed[0] = systemPrompt; 
                        } else {
                            parsed.unshift(systemPrompt); 
                        }
                        
                        conversation = parsed;
                        
                        if (conversation.length > 1) { // Render if there's user/ai history
                            welcomeScreen.style.display = "none";
                            conversation.forEach(msg => {
                                if (msg.role !== 'system') {
                                    renderMessage(msg.content, msg.role);
                                }
                            });
                        }
                    } else {
                        conversation = [systemPrompt];
                    }
                } else {
                    conversation = [systemPrompt];
                }
            } catch(e) {
                console.error("Storage load error:", e);
                conversation = [systemPrompt];
            }
            scrollToBottom();
        }

        function saveChats() {
            localStorage.setItem("krishna_ai_history", JSON.stringify(conversation));
        }

        function clearChat() {
            // 1. Clear storage and reset array
            localStorage.removeItem("krishna_ai_history");
            conversation = [systemPrompt];
            isSending = false;
            
            // 2. Remove all chat messages from UI (without reloading page)
            const msgs = document.querySelectorAll('.chat-msg');
            msgs.forEach(m => m.remove());
            removeLoading();
            
            // 3. Show Welcome screen again
            welcomeScreen.style.display = ""; // Removes 'none', falls back to flex class
            
            // 4. Reset Input Box
            input.value = "";
            input.style.height = 'auto';
            sendBtn.classList.add("bg-[#444]", "text-gray-500");
            sendBtn.classList.remove("bg-white", "text-black");
            sendBtn.disabled = true;
        }

        // Initialize chats on load
        loadChats();

        // ==========================================
        // UI & EVENT LISTENERS
        // ==========================================
        input.addEventListener("input", function() {
            if (this.value.trim().length > 0 && !isSending) {
                sendBtn.classList.remove("bg-[#444]", "text-gray-500");
                sendBtn.classList.add("bg-white", "text-black");
                sendBtn.disabled = false;
            } else {
                sendBtn.classList.add("bg-[#444]", "text-gray-500");
                sendBtn.classList.remove("bg-white", "text-black");
                sendBtn.disabled = true;
            }
        });

        function handleKeydown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chat.scrollTop = chat.scrollHeight;
            }, 100);
        }

        function renderMessage(text, role) {
            const div = document.createElement("div");
            // Added 'chat-msg' class so we can clear them easily
            div.className = "chat-msg w-full flex justify-center py-5 px-4 md:px-0";
            
            if (role === "user") {
                div.innerHTML = `
                    <div class="max-w-3xl w-full flex justify-end">
                        <div class="bg-[#2f2f2f] text-gray-100 px-5 py-3 rounded-3xl max-w-[75%] break-words text-[15.5px]">
                            ${text.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            } else {
                // Parse markdown for AI responses
                const parsedHTML = marked.parse(text);
                div.innerHTML = `
                    <div class="max-w-3xl w-full flex gap-4">
                        <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center flex-shrink-0 mt-1">
                            <span class="text-black font-bold text-sm">K</span>
                        </div>
                        <div class="flex-1 prose prose-invert max-w-none text-gray-100 text-[15.5px] leading-relaxed min-w-0">
                            ${parsedHTML}
                        </div>
                    </div>
                `;
            }

            chat.appendChild(div);
            scrollToBottom();
        }

        function showLoading() {
            const div = document.createElement("div");
            div.id = "loading-indicator";
            // Added 'chat-msg' class here as well
            div.className = "chat-msg w-full flex justify-center py-5 px-4 md:px-0";
            div.innerHTML = `
                <div class="max-w-3xl w-full flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center flex-shrink-0 mt-1">
                        <span class="text-black font-bold text-sm">K</span>
                    </div>
                    <div class="flex-1 mt-3 typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chat.appendChild(div);
            scrollToBottom();
        }

        function removeLoading() {
            const loader = document.getElementById("loading-indicator");
            if (loader) loader.remove();
        }

        // ==========================================
        // API CALL
        // ==========================================
        async function sendMessage() {
            const text = input.value.trim();
            if (!text || isSending) return;

            welcomeScreen.style.display = "none";
            isSending = true;
            
            // Reset input UI
            input.value = "";
            input.style.height = 'auto';
            sendBtn.classList.add("bg-[#444]", "text-gray-500");
            sendBtn.classList.remove("bg-white", "text-black");
            sendBtn.disabled = true;

            // Render User Message
            renderMessage(text, "user");
            conversation.push({ role: "user", content: text });
            saveChats();

            showLoading();

            try {
                const response = await fetch(API_BASE_URL + "/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true" // Important for Ngrok
                    },
                    body: JSON.stringify({
                        model: "gemma2:2b",
                        messages: conversation
                    })
                });

                const data = await response.json();
                removeLoading();

                if (!response.ok) {
                    const errorMsg = "Error: " + (data.error || "Server issue");
                    renderMessage(errorMsg, "assistant");
                    return;
                }

                const reply = data.reply || data.message?.content || "No response.";
                
                // Add AI reply to conversation and UI
                conversation.push({ role: "assistant", content: reply });
                renderMessage(reply, "assistant");
                saveChats();

            } catch (error) {
                removeLoading();
                renderMessage("Server se connect nahi ho pa raha hai. (Ensure Ngrok is running)\n\n" + error.message, "assistant");
            } finally {
                isSending = false;
            }
        }
    </script>
</body>
</html>
